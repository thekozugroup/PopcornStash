[package]
name = "stash-torrentd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
stash-core = { path = "../stash-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io", "rt"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
bytes = "1"
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
nix = { version = "0.30", features = ["fs", "signal", "process", "user", "dir", "socket", "net"] }
socket2 = { version = "0.6", features = ["all"] }
ipnet = "2"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
