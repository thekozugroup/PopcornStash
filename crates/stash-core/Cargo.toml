[package]
name = "stash-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
# Capture times in the server's time zone (TZ); the bundled tzdb covers images without tzdata.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io", "rt"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
bytes = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "json"] }
regex = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
notify = "8"
kamadak-exif = "0.6"
mime_guess = "2"
libc = "0.2"
nix = { version = "0.30", features = ["fs", "signal", "process", "user"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
