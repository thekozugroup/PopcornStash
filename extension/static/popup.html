<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>PopcornStash</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <header class="masthead">
      <div class="brand">
        <img class="brand-mark" src="icons/icon-48.png" width="32" height="32" alt="" aria-hidden="true" />
        <div class="brand-text">
          <p class="brand-word">Popcorn<span class="brand-product">Stash</span></p>
          <p class="brand-host" id="server-host" hidden></p>
        </div>
      </div>
      <button class="button button-quiet" type="button" id="open-options" hidden>Options</button>
    </header>
    <main id="view" class="view"></main>
  </body>
</html>
