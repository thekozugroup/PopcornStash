<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>PopcornStash</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 512 512" width="30" height="30" aria-hidden="true">
          <rect class="brand-mark-tile" width="512" height="512" rx="112" />
          <rect class="brand-mark-glyph" x="166" y="170" width="52" height="236" rx="26" />
          <circle class="brand-mark-bowl" cx="280" cy="250" r="76" fill="none" stroke-width="52" />
        </svg>
        <div class="brand-text">
          <p class="brand-word">Popcorn<span class="brand-product">Stash</span></p>
          <p class="brand-host" id="server-host" hidden></p>
        </div>
      </div>
      <button class="button button-quiet" type="button" id="open-options" hidden>Options</button>
    </header>
    <main id="view" class="view"></main>
  </body>
</html>
