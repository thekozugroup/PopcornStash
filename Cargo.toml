[workspace]
resolver = "3"
members = ["crates/stash-core", "crates/stash-server", "crates/stash-torrentd", "crates/popcornstash"]

[patch.crates-io]
# IPv4 fallback on hosts without IPv6; see vendor/librqbit-dualstack-sockets/PATCHED.md.
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
# Reconnect to a peer that went away and came back; see vendor/librqbit/PATCHED.md.
librqbit = { path = "vendor/librqbit" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/thekozugroup/PopcornStash"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

# Keep debug builds small: parallel agents share one target dir on a limited disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
